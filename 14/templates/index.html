<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Тональність кінорецензії</title><style>body{background:#f8f4ed;color:#241f1b;font:18px/1.55 system-ui;max-width:680px;margin:8vh auto;padding:1rem}h1{font:2.9rem Georgia,serif}textarea{box-sizing:border-box;width:100%;padding:1rem;font:inherit}button{background:#483324;color:white;padding:.65rem 1.2rem;border:0;font:inherit}output{font-weight:bold}</style><main><h1>Тональність кінорецензії</h1><form method="post" action="/predict"><label for="review">Англомовний відгук про фільм</label><textarea id="review" name="review" rows="6" required>{{ text }}</textarea><p><button>Визначити тональність</button></p></form>{% if result %}<output>{{ result }} відгук</output>{% endif %}{% if error %}<p role="alert">{{ error }}</p>{% endif %}</main></html>
